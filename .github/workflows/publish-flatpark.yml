name: Publish to FlatPark

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (for example: v0.2.0)'
        required: true
        default: 'v0.2.0'

concurrency:
  group: flatpark-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-to-flatpark:
    name: Notify FlatPark of New Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Execute FlatPark Publish Action
        uses: flatpark/publish-action@v1
        continue-on-error: true
        with:
          app-id: io.github.Antux912012.RecGo
          tag: ${{ github.event.inputs.tag || github.event.release.tag_name }}
