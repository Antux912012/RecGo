[Application]
name=io.github.antonio.RecGo
runtime=org.gnome.Platform/x86_64/50
sdk=org.gnome.Sdk/x86_64/50
command=recgo

[Context]
shared=network;ipc;
sockets=wayland;fallback-x11;pulseaudio;
devices=all;
