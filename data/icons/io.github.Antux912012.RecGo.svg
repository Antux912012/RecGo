<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <filter id="camShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2787ec"/>
      <stop offset="50%" stop-color="#1c71d8"/>
      <stop offset="100%" stop-color="#1357b3"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c8df2"/>
      <stop offset="100%" stop-color="#1a69cc"/>
    </linearGradient>
    <linearGradient id="metalRing" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#686e78"/>
      <stop offset="45%" stop-color="#3a3f47"/>
      <stop offset="100%" stop-color="#1d2026"/>
    </linearGradient>
    <linearGradient id="metalInner" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#555a63"/>
      <stop offset="50%" stop-color="#2a2e35"/>
      <stop offset="100%" stop-color="#16181c"/>
    </linearGradient>
    <linearGradient id="standGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#555b64"/>
      <stop offset="50%" stop-color="#32363d"/>
      <stop offset="100%" stop-color="#1d2025"/>
    </linearGradient>
    <radialGradient id="lensRed" cx="44%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#ff5e52"/>
      <stop offset="45%" stop-color="#ee2228"/>
      <stop offset="82%" stop-color="#a80a12"/>
      <stop offset="100%" stop-color="#590307"/>
    </radialGradient>
    <linearGradient id="lensGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Outer Window Frame -->
  <g filter="url(#dropShadow)">
    <rect x="44" y="44" width="424" height="424" rx="44" ry="44"
          fill="url(#frameGrad)" stroke="#0d2544" stroke-width="10"/>
    <!-- Titlebar highlight -->
    <path d="M 49 88 A 39 39 0 0 1 88 49 L 424 49 A 39 39 0 0 1 463 88 L 463 114 L 49 114 Z"
          fill="url(#headerGrad)"/>
    <line x1="49" y1="114" x2="463" y2="114" stroke="#0d2544" stroke-width="5"/>

    <!-- Window Traffic Lights -->
    <circle cx="84" cy="80" r="11.5" fill="#ed333b"/>
    <circle cx="116" cy="80" r="11.5" fill="#f6d32d"/>
    <circle cx="148" cy="80" r="11.5" fill="#2ec27e"/>

    <!-- Titlebar Pill -->
    <rect x="182" y="75" width="168" height="10" rx="5" fill="#10407c"/>
  </g>

  <!-- Inner White/Clear Viewport -->
  <rect x="76" y="116" width="360" height="320" rx="14" ry="14"
        fill="#ffffff" stroke="#0d2544" stroke-width="4"/>

  <!-- Viewfinder Corner Brackets -->
  <g fill="none" stroke="#4fc3f7" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 106 184 L 106 142 L 154 142"/>
    <path d="M 358 142 L 406 142 L 406 184"/>
    <path d="M 106 364 L 106 406 L 154 406"/>
    <path d="M 358 406 L 406 406 L 406 364"/>
  </g>

  <!-- Webcam Assembly -->
  <g filter="url(#camShadow)">
    <!-- Stand Neck -->
    <rect x="224" y="344" width="64" height="30" rx="4"
          fill="url(#standGrad)" stroke="#14161a" stroke-width="4"/>
    <!-- Stand Base -->
    <path d="M 184 396 C 184 378 196 370 216 370 L 296 370 C 316 370 328 378 328 396 Z"
          fill="url(#standGrad)" stroke="#14161a" stroke-width="5" stroke-linejoin="round"/>
    <line x1="196" y1="388" x2="316" y2="388" stroke="#6c737d" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

    <!-- Outer Metallic Housing -->
    <circle cx="256" cy="252" r="102" fill="url(#metalRing)" stroke="#14161a" stroke-width="6"/>
    <!-- Subtle Inner Bevel -->
    <circle cx="256" cy="252" r="88" fill="none" stroke="#757c87" stroke-width="2" opacity="0.55"/>
    <circle cx="256" cy="252" r="80" fill="url(#metalInner)" stroke="#101216" stroke-width="3"/>

    <!-- Green Status LED -->
    <circle cx="256" cy="169" r="7" fill="#2ec27e" stroke="#14161a" stroke-width="2"/>
    <circle cx="254" cy="167" r="2.2" fill="#8ff0a4"/>

    <!-- Deep Lens Recess -->
    <circle cx="256" cy="252" r="68" fill="#121418" stroke="#08090b" stroke-width="3"/>
    <!-- Red Lens -->
    <circle cx="256" cy="252" r="59" fill="url(#lensRed)" stroke="#2b0608" stroke-width="2"/>

    <!-- Specular Highlights -->
    <ellipse cx="242" cy="222" rx="34" ry="18" transform="rotate(-22 242 222)" fill="url(#lensGloss)"/>
    <path d="M 212 232 A 48 48 0 0 1 248 202" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.78"/>
    <circle cx="208" cy="246" r="4" fill="#ffffff" opacity="0.72"/>
  </g>
</svg>
