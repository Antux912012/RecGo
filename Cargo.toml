[package]
name = "recgo"
version = "0.1.0"
edition = "2021"
authors = ["Antonio"]
description = "Screen and webcam recorder for GNOME desktop"
license = "GPL-3.0-or-later"

[dependencies]
gtk = { version = "0.9", package = "gtk4", features = ["v4_14"] }
adw = { version = "0.7", package = "libadwaita", features = ["v1_5"] }
gst = { version = "0.23", package = "gstreamer" }
gst-app = { version = "0.23", package = "gstreamer-app" }
gst-video = { version = "0.23", package = "gstreamer-video" }
gst-gl = { version = "0.23", package = "gstreamer-gl" }
gst-pbutils = { version = "0.23", package = "gstreamer-pbutils" }
ashpd = { version = "0.9", default-features = false, features = ["tokio", "gtk4"] }
tokio = { version = "1", features = ["full"] }
zbus = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glib = "0.20"
gio = "0.20"
